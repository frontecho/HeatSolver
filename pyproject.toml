[project]
name = "heatsolver"
version = "0.1.0"
description = "Direct PDE-constrained geothermal inversion for the Ordos Basin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyamg>=5.3.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
